<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #1f1e1b;
      --bg-raised: #262521;
      --bg-input: #161512;
      --border: #3a3833;
      --border-soft: #2e2c27;
      --text: #e8e6e1;
      --text-dim: #a8a49b;
      --text-faint: #6e6a61;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.14);
      --accent-border: rgba(217, 119, 87, 0.35);
      --green: #7fb069;
      --green-soft: rgba(127, 176, 105, 0.12);
      --red: #e05d5d;
      --red-soft: rgba(224, 93, 93, 0.12);
      --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    ::selection { background: var(--accent-soft); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* ---------- HEADER ---------- */
    .header {
      background: var(--bg-raised);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title { display: flex; align-items: center; gap: 10px; }

    .logo-box {
      color: var(--accent);
      font-size: 20px;
      line-height: 1;
      animation: spark 4s ease-in-out infinite;
    }

    @keyframes spark {
      0%, 100% { opacity: 1; transform: rotate(0deg); }
      50% { opacity: 0.75; transform: rotate(90deg); }
    }

    .header-text {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .header-sub {
      margin: 0;
      font-size: 10px;
      color: var(--text-faint);
      font-family: var(--mono);
      letter-spacing: 0.5px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 4px 10px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(127, 176, 105, 0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(127, 176, 105, 0); }
    }

    /* ---------- ACTIVITY LOG ---------- */
    #log {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: rise 0.25s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      max-width: 94%;
      word-wrap: break-word;
    }

    .msg-user {
      background: var(--bg-raised);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--accent);
      color: var(--text);
      align-self: flex-start;
      font-family: var(--mono);
      font-size: 12px;
    }

    .msg-user::before {
      content: "> ";
      color: var(--accent);
      font-weight: 700;
    }

    .msg-ai {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: #f3d9cd;
      align-self: flex-start;
    }

    .msg-ai::before {
      content: "\2733  ";
      color: var(--accent);
      font-size: 11px;
    }

    .msg-err {
      background: var(--red-soft);
      border: 1px solid rgba(224, 93, 93, 0.35);
      color: #f1b8b8;
      font-family: var(--mono);
      font-size: 11.5px;
      align-self: stretch;
      max-width: 100%;
    }

    .msg-debug {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      padding: 1px 0 1px 12px;
      border-left: 2px solid var(--border-soft);
      align-self: flex-start;
      line-height: 1.5;
    }

    .msg-debug::before { content: "\25B8 "; color: var(--text-faint); }

    .msg-card {
      background: var(--green-soft);
      border: 1px solid rgba(127, 176, 105, 0.3);
      border-left: 3px solid var(--green);
      color: #d7e8cf;
      font-size: 12.5px;
      align-self: flex-start;
      font-family: var(--mono);
    }

    .empty-state {
      text-align: center;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 12px;
      margin-top: 48px;
      letter-spacing: 1px;
      line-height: 2;
    }

    .empty-state::before {
      content: "\2733";
      display: block;
      font-size: 26px;
      color: var(--accent);
      opacity: 0.5;
      margin-bottom: 10px;
      letter-spacing: 0;
    }

    /* ---------- COMPOSER ---------- */
    .input-area {
      padding: 12px 16px 14px;
      background: var(--bg-raised);
      border-top: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .composer {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0;
      font-size: 13px;
      font-family: var(--sans);
      line-height: 1.5;
      resize: none;
      outline: none;
      caret-color: var(--accent);
    }

    textarea::placeholder { color: var(--text-faint); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border-soft);
    }

    .checkbox-lbl {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .checkbox-lbl input { accent-color: var(--accent); cursor: pointer; }

    .settings-link {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .settings-link:hover { color: var(--accent); }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      letter-spacing: 1.5px;
      transition: transform 0.12s, box-shadow 0.2s, filter 0.15s;
    }

    .btn:active { transform: scale(0.985); }

    .btn-run {
      background: var(--accent);
      box-shadow: 0 2px 12px rgba(217, 119, 87, 0.25);
    }

    .btn-run:hover { filter: brightness(1.08); box-shadow: 0 4px 18px rgba(217, 119, 87, 0.35); }

    .btn-stop {
      background: var(--red);
      display: none;
      box-shadow: 0 2px 12px rgba(224, 93, 93, 0.25);
    }

    .btn-stop:hover { filter: brightness(1.08); }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-title">
      <div class="logo-box">✳</div>
      <div>
        <p class="header-text">NanoAgent</p>
        <p class="header-sub">v1.3.1</p>
      </div>
    </div>
    <div class="status-pill"><span class="status-dot"></span>ready</div>
  </div>

  <div id="log">
    <div class="empty-state">READY FOR YOUR DIRECTIVE</div>
  </div>

  <div class="input-area">
    <div class="composer">
      <textarea id="prompt" rows="3" placeholder="Describe a task… e.g. Find the 5 best-rated hotels in Pune and save prices to Sheets"></textarea>
      <div class="toolbar">
        <label class="checkbox-lbl"><input type="checkbox" id="show-boxes" checked> Vision DOM</label>
        <a href="options.html" target="_blank" class="settings-link">⚙ Providers</a>
      </div>
    </div>
    <button id="run" class="btn btn-run">RUN AGENT</button>
    <button id="stop" class="btn btn-stop">STOP</button>
  </div>
  <script src="sidepanel.js"></script>
</body>

</html>
